# =============================================================================
# GEAR GUARD GARY ($RIVN) — Render blueprint.
#
# One-click: New -> Blueprint -> pick this repo -> Apply. Nothing in the Render
# dashboard is required for a working deploy: there are no credentials in this
# project, because every upstream it reads is keyless and it never writes
# anywhere. Two services come up — a read-only FastAPI backend and a static
# site — and the site is usable the moment the backend answers.
#
# ---------------------------------------------------------------------------
# PATHS. This file lives at the repository root, which is the only place
# Render auto-detects a blueprint — so the rootDir values below are correct as
# written and this repo deploys with no path edits. If this project is ever
# vendored INSIDE a larger repo (it started as a `gearguard/` directory in
# one), it takes two changes: move this file to that repo's root and prefix
# both rootDir values with the directory name.
#
# ---------------------------------------------------------------------------
# THE ONE TRAP WORTH READING BEFORE YOU APPLY.
#
# The static site is served as files, so the backend's URL has to be stamped
# into it AT BUILD TIME (site/build.sh writes config.js from API_URL). It must
# be the backend's PUBLIC url.
#
# Do NOT wire it with `fromService ... property: host`. That resolves to the
# INTERNAL service name — `gearguard-api`, with no domain — which is reachable
# only from inside Render's private network. A browser cannot resolve it, and
# the deck loads straight to "backend unreachable" with nothing in the logs to
# explain why. Paste the URL shown on the backend's own service page instead,
# and re-deploy the site after any rename or custom-domain change.
#
# (token.js promotes a scheme-less value to https:// so a hand-typed hostname
# still works. It cannot rescue an unresolvable one.)
# ---------------------------------------------------------------------------

services:
  # --- Backend: the read-only readout service ------------------------------
  # No database. No disk. No secrets. It caches two keyless public feeds and
  # serves JSON, and tests/test_api.py fails the moment a non-GET route
  # appears — that is the guard on the whole posture, not a style preference.
  - type: web
    name: gearguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pinned to the interpreter the test suite is verified against.
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- the token -------------------------------------------------------
      # The contract the readout quotes. It is also printed in the hero as a
      # copy-paste address, so THESE TWO MUST MATCH: site/index.html carries
      # the string a visitor copies, and this carries the one the price is
      # read from. If they ever drift, the page quotes one token and hands
      # out the address of another — change both together, always.
      #
      # Blank is still a supported, honest state: the API then answers
      # status="unset" and the deck renders "CONTRACT NOT SET" rather than
      # inventing a price.
      - key: TOKEN_NAME
        value: "Gear Guard Gary"
      # The token you HOLD is $GARY. The asset holders are PAID IN is tokenized
      # RIVN (REWARD_ASSET below). Those two must stay different names: a
      # ticker identical to the equity it pays out is the confusion the page
      # footer then has to spend three paragraphs undoing.
      - key: TOKEN_SYMBOL
        value: "GARY"
      - key: TOKEN_CONTRACT
        value: "0x401923511EC7356AeC6b7717207394feA97CEa01"
      # THE PINNED POOL — set this and the quote stops being a search.
      #
      # The quote used to be found by searching for TOKEN_CONTRACT, which
      # assumes the token's identifier on its chain is a 20-byte EVM address.
      # Robinhood Chain identifiers are 32 bytes (this pool id is 66
      # characters), so that search matched nothing and the deck sat on "no
      # pool" while the token traded fine. Naming the pool removes the guess.
      #
      # It is the last path segment of the pool's own DexScreener URL:
      #   dexscreener.com/<TOKEN_CHAIN>/<TOKEN_PAIR_ID>
      # Leave blank to fall back to the contract-address search, which is
      # still correct for ordinary EVM chains and for Solana.
      - key: TOKEN_PAIR_ID
        value: "0x17f1144200cac91a074d2787900117d0d7803177c1b4d00f80810c189a41a99e"
      # A declared LABEL and a fallback only. The upstream looks a contract up
      # across every chain it indexes, so this narrows nothing — and when a
      # live pool answers, the chain it actually trades on replaces this
      # string in the response.
      - key: TOKEN_CHAIN
        value: "robinhood"

      # What holders receive, and where. Named here rather than only in the
      # page so the two cannot drift. The chain slug above also selects the
      # candle source for the price chart (see GT_NETWORKS in feeds.py); a
      # chain with no mapping reports "unsupported_chain" and draws no chart
      # rather than guessing a slug and charting somebody else's pool.
      - key: REWARD_ASSET
        value: "tokenized RIVN"
      - key: REWARD_NETWORK
        value: "Robinhood Chain"

      # A pool shallower than this is reported as too thin to quote rather
      # than printed. Raise it once the pool is real: the floor exists so a
      # copycat puddle can never look like a market on this page.
      - key: MIN_LIQUIDITY_USD
        value: "5000"

      # Context markets behind the token (Pyth Hermes, keyless). Only symbols
      # with a verified feed id in app/feeds.py are used; unknown ones are
      # dropped rather than guessed.
      - key: MAJORS
        value: "SOL/USD,ETH/USD,BTC/USD"

      # Quote cache. Both upstreams are public and rate-limited, and the deck
      # polls every 30s per visitor — the cache is what keeps a busy hour from
      # turning into upstream 429s and a dark feed for everyone.
      - key: CACHE_TTL_SECONDS
        value: "30"

      # "*" keeps the static site talking to the API before its URL is known.
      # Tighten to the site's origin once the name is settled. Nothing here is
      # authenticated and no cookies are sent, so this is a hygiene control,
      # not the thing standing between a stranger and your money — that is the
      # absence of a write path.
      - key: CORS_ORIGINS
        value: "*"

      # Render's free tier suspends a web service after ~15 min without
      # inbound traffic. The self-ping keeps the process warm so the first
      # real visitor does not pay a cold start plus two upstream round-trips.
      # It reads the platform-injected RENDER_EXTERNAL_URL, so no URL is
      # needed here; unset that and the ping is a no-op rather than a loop.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_SECONDS
        value: "600"

  # --- Frontend: the deck (static, zero dependencies) ----------------------
  # There is no bundler and nothing to install: the site is hand-written
  # HTML/CSS/JS. build.sh's only job is stamping API_URL into config.js.
  - type: web
    name: gearguard-site
    runtime: static
    rootDir: site
    buildCommand: sh ./build.sh
    staticPublishPath: .
    autoDeploy: true
    envVars:
      # The backend's PUBLIC url — see THE ONE TRAP above. After the first
      # apply, copy the URL from the gearguard-api service page over this
      # value if Render suffixed the name (it does when the name is already
      # taken globally), then redeploy this site.
      - key: API_URL
        value: https://gearguard-api.onrender.com
    headers:
      # The deck loads Google Fonts and calls the API over https; nothing else
      # is fetched, nothing is embedded, and no inline handler exists. Locking
      # that down costs nothing and makes an injected script a broken request
      # rather than a working one.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          style-src 'self' https://fonts.googleapis.com;
          font-src https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self' https:;
          frame-ancestors 'none';
          base-uri 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # CACHING. Asset filenames here are stable and unhashed (gg.css,
      # token.js, charts.js), so a CDN or browser that caches them by name
      # keeps serving the OLD file after a deploy — the site looks completely
      # unchanged and the new script never runs. That failure is invisible:
      # the deploy succeeds, the logs are clean, and the page is simply stale.
      #
      # `no-cache` does not mean "do not cache" — it means revalidate before
      # reuse, so a 304 still costs almost nothing while a real change lands
      # immediately. Correctness over a few bytes; introduce content hashes in
      # the filenames first if this ever needs to be `immutable`.
      - path: /*
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # NO CATCH-ALL REWRITE. There used to be `/* -> /index.html` here, copied
    # from the standard single-page-app recipe. This site is not an SPA — it
    # has no client-side router and exactly one page, so the rule bought
    # nothing and could only do harm:
    #
    #   a request for /assets/js/charts.js that misses for ANY reason (not yet
    #   deployed, renamed, a typo) stops being a clean 404 and becomes a
    #   200 serving index.html. The browser gets `text/html` where it asked
    #   for a script or a stylesheet, `X-Content-Type-Options: nosniff`
    #   refuses it, and the page renders unstyled and inert with nothing in
    #   the logs to explain why. A missing file should look missing.
    #
    # If a genuine SPA route is ever added here, scope the rewrite to it
    # (`/app/*`), never to `/*`.
