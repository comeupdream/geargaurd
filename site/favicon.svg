<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Gear Guard Gary's mark: a gear with a visor slot. Same glyph as the
       header, kept in sync by hand — one mark, two places. -->
  <rect width="48" height="48" rx="10" fill="#0a0e0c"/>
  <g stroke="#6ea8d8" stroke-width="2.8" stroke-linecap="butt">
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(0 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(45 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(90 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(135 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(180 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(225 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(270 24 24)"/>
    <line x1="24" y1="7" x2="24" y2="12" transform="rotate(315 24 24)"/>
  </g>
  <circle cx="24" cy="24" r="12.5" fill="none" stroke="#6ea8d8" stroke-width="2.2"/>
  <rect x="16" y="21.6" width="16" height="4.8" rx="2.4" fill="#ffd400"/>
</svg>
